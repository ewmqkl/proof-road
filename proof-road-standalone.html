<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>证明之路 · 从命题逻辑到代数定理</title>
<style>
:root {
  --bg: #0f1115; --panel: #171a21; --panel2: #1d2129; --line: #2a2f3a;
  --fg: #e8eaf0; --dim: #98a2b3; --accent: #6ea8fe; --ok: #4ade80; --bad: #f87171; --warn: #fbbf24;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.6 "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif; }
.topbar { display: flex; justify-content: space-between; align-items: center; padding: 14px 22px; border-bottom: 1px solid var(--line); background: #12151b; position: sticky; top: 0; z-index: 5; }
.brand { display: flex; gap: 12px; align-items: center; }
.logo { font-size: 30px; color: var(--accent); }
h1 { font-size: 19px; margin: 0; }
.sub { margin: 0; color: var(--dim); font-size: 12.5px; }
.stats { display: flex; gap: 12px; align-items: center; color: var(--dim); }
main { display: grid; grid-template-columns: 260px 1fr; gap: 18px; padding: 18px 22px 60px; align-items: start; }
.sidebar { position: sticky; top: 78px; max-height: calc(100vh - 100px); overflow: auto; }
.level-list { display: flex; flex-direction: column; gap: 6px; }
.tier-head { color: var(--dim); font-size: 12px; margin: 10px 0 2px; letter-spacing: .06em; }
.level-item { display: flex; gap: 8px; align-items: center; padding: 8px 10px; border-radius: 8px; background: var(--panel); border: 1px solid transparent; cursor: pointer; font-size: 13.5px; }
.level-item:hover { border-color: var(--line); }
.level-item.active { border-color: var(--accent); background: #1b2233; }
.level-item .dot { width: 15px; text-align: center; color: var(--dim); }
.level-item.done .dot { color: var(--ok); }
.workspace { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.level-head { display: flex; align-items: baseline; gap: 12px; }
.level-head h2 { margin: 0; font-size: 20px; }
.tier { color: var(--dim); font-size: 12.5px; border: 1px solid var(--line); padding: 1px 8px; border-radius: 999px; }
.goal-box { background: linear-gradient(180deg,#1b2130,#171a21); border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px; }
.goal-box .label { color: var(--dim); font-size: 12px; }
.goal { font-size: 21px; font-family: "Cambria Math", "Latin Modern Math", Georgia, serif; margin-top: 4px; }
.openvars { color: var(--dim); font-size: 12.5px; margin-top: 4px; }
.teach { color: #cbd5e1; margin: 0; }
.premise-note { color: var(--dim); margin: 0; font-size: 13.5px; }
.panels { display: grid; grid-template-columns: 1.35fr 1fr; gap: 14px; align-items: start; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.panel-head { display: flex; justify-content: space-between; padding: 9px 13px; border-bottom: 1px solid var(--line); color: var(--dim); font-size: 13px; background: var(--panel2); }
.panel-foot { display: flex; gap: 8px; padding: 9px 13px; border-top: 1px solid var(--line); }
.facts { max-height: 380px; overflow: auto; padding: 6px; }
.fact { display: flex; gap: 9px; align-items: flex-start; padding: 7px 9px; border-radius: 7px; cursor: pointer; border: 1px solid transparent; }
.fact:hover { background: #1e2430; }
.fact.sel { background: #1c2740; border-color: var(--accent); }
.fact.assume { border-left: 3px solid var(--warn); }
.fact.derived { border-left: 3px solid var(--ok); }
.fact .fx { font-family: "Cambria Math", Georgia, serif; font-size: 16px; }
.fact .meta { color: var(--dim); font-size: 11.5px; }
.fact .id { color: #64748b; font-size: 11.5px; min-width: 34px; }
.rules { display: flex; flex-wrap: wrap; gap: 7px; padding: 11px; }
.rule { background: #202634; border: 1px solid var(--line); color: var(--fg); border-radius: 8px; padding: 7px 11px; cursor: pointer; font-size: 13.5px; }
.rule:hover { border-color: var(--accent); background: #242c3d; }
.rule.primary { background: #2b3a5c; border-color: #3d5892; }
.choices { border-top: 1px dashed var(--line); padding: 10px 11px; display: flex; flex-wrap: wrap; gap: 7px; align-items: center; background: #14181f; }
.choices-head { color: var(--warn); font-size: 13px; width: 100%; margin-bottom: 2px; }
.proof-area { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
.proof { margin: 0; padding: 10px 14px 14px 34px; display: flex; flex-direction: column; gap: 5px; }
.proof li { font-size: 14px; }
.proof .why { color: var(--dim); font-size: 12px; margin-left: 8px; }
.assume-bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; color: var(--dim); }
.scopes { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-left: 4px; }
.guide { border: 1px solid #3d5892; background: #151d2e; border-radius: 10px; padding: 10px 12px; margin: 8px 0; text-align: left; }
.guide-head { font-size: 13.5px; color: #cfe0ff; margin-bottom: 8px; }
.guide-branch { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 6px 0; border-top: 1px solid #232c40; font-size: 13px; color: var(--dim); }
.guide-branch .mark { color: #6f7d99; }
.guide-branch.done .mark { color: #5fd39a; }
.guide-branch.done { color: #9fd8bb; }
.guide-tip { margin-top: 8px; font-size: 12.5px; color: var(--dim); }
.facts-empty { padding: 14px 12px; border: 1px dashed var(--line); border-radius: 10px; color: var(--dim); font-size: 13px; line-height: 1.6; }
.scope-chip { border: 1px solid #3d5892; background: #1b2740; color: #cfe0ff; border-radius: 999px; padding: 4px 10px; font-size: 12.5px; }
.scope-none { color: var(--dim); font-size: 12.5px; }
.fact.closed { opacity: .45; }
.fact.depth1 { margin-left: 14px; }
.fact.depth2 { margin-left: 28px; }
.fact.depth3 { margin-left: 42px; }
input { background: #12151b; border: 1px solid var(--line); color: var(--fg); border-radius: 8px; padding: 8px 11px; font-size: 14px; min-width: 260px; }
button { background: #202634; border: 1px solid var(--line); color: var(--fg); border-radius: 8px; padding: 8px 13px; cursor: pointer; font-size: 13.5px; }
button:hover { border-color: var(--accent); }
button.primary { background: #2b3a5c; border-color: #3d5892; }
button.ghost { background: transparent; color: var(--dim); }
.status { padding: 11px 14px; border-radius: 9px; border: 1px solid var(--line); background: var(--panel); font-size: 14px; }
.status.ok { border-color: #2f6b46; background: #14261c; color: #b7f7cf; }
.status.bad { border-color: #7f2b2b; background: #2a1618; color: #ffc9c9; }
.status.warn { border-color: #7a5a17; background: #2a2413; color: #ffe6a8; }
.axioms { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; }
.axioms table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.axioms td { padding: 4px 6px; border-bottom: 1px solid #232833; vertical-align: top; }
.axioms td.n { color: var(--accent); width: 52px; }
.axioms td.f { font-family: "Cambria Math", Georgia, serif; }
.axioms td.d { color: var(--dim); }
@media (max-width: 1000px) { main { grid-template-columns: 1fr; } .panels { grid-template-columns: 1fr; } .sidebar { position: static; max-height: none; } }

</style>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="logo">⊢</span>
    <div>
      <h1>证明之路</h1>
      <p class="sub">用命题逻辑与自然演绎，一步步推出中学数学定理</p>
    </div>
  </div>
  <div class="stats">
    <span id="progress-text">0 / 0 关</span>
    <button id="btn-reset" class="ghost" title="清空本地进度">重置进度</button>
  </div>
</header>
<main>
  <aside class="sidebar"><div id="level-list" class="level-list"></div></aside>
  <section class="workspace">
    <div class="level-head">
      <h2 id="level-title">载入中…</h2>
      <div class="tier" id="level-tier"></div>
    </div>
    <div class="goal-box">
      <div class="label">要证明的结论</div>
      <div class="goal" id="goal-text">—</div>
      <div class="openvars" id="goal-openvars"></div>
    </div>
    <p class="teach" id="level-teach"></p>
    <p class="premise-note" id="level-premises"></p>
    <div class="panels">
      <div class="panel">
        <div class="panel-head"><span>可用事实（点选作为前提）</span><span class="hint" id="select-hint">已选 0 条</span></div>
        <div class="facts" id="facts"></div>
        <div class="panel-foot">
          <button id="btn-instantiate" class="ghost">展开全称公理（自动实例化）</button>
          <button id="btn-undo" class="ghost">撤销一步</button>
        </div>
      </div>
      <div class="panel">
        <div class="panel-head"><span>推理规则</span><span class="hint" id="rule-hint">先选前提，再点规则</span></div>
        <div class="rules" id="rules"></div>
        <div class="choices" id="choices" hidden></div>
      </div>
    </div>
    <div class="proof-area">
      <div class="panel-head"><span>证明记录</span><span class="hint" id="proof-hint"></span></div>
      <ol class="proof" id="proof"></ol>
    </div>
    <div class="assume-bar">
      <span>子证明：</span>
      <input id="assume-input" placeholder="输入假设式，例如 A 或 not B">
      <button id="btn-assume">打开假设</button>
      <button id="btn-hint" class="primary">提示</button>
      <span class="scopes" id="scope-list"></span>
    </div>
    <div class="status" id="status">选好前提后点击规则即可推进一步。</div>
    <div class="axioms-toggle"><button id="btn-axioms" class="ghost">查看本关公理表</button></div>
    <div class="axioms" id="axioms" hidden></div>
  </section>
</main>
<script type="module">
const reg = {};
reg["src/core/logic.js"] = (function () {
  let m;
m = {};
// core/logic.js —— 内核：项、公式、de Bruijn 绑定、替换、解析、打印
// 零依赖，浏览器与 Node 均可直接 import。

/* ============================ 1. 项 (Term) ============================ */

const v = (name, free = false) => ({ k: 'v', name, free });
const c0 = (name, ...args) => ({ k: 'c', name, args });
const lit = (n) => ({ k: 'n', n });
const B = (i) => ({ k: 'b', i });          // de Bruijn 索引，0 = 最内层
const EV = (name) => ({ k: 'e', name });   // 元变量（证明中的待实例化占位）

/* ============================ 2. 公式 (Formula) ============================ */

const TOP = { k: 'top' };
const BOT = { k: 'bot' };
const atom = (name, ...args) => ({ k: 'atom', name, args });
const eq = (a, b) => ({ k: 'eq', a, b });
const not = (a) => ({ k: 'not', a });
const and = (a, b) => ({ k: 'and', a, b });
const or = (a, b) => ({ k: 'or', a, b });
const imp = (a, b) => ({ k: 'imp', a, b });
const iff = (a, b) => ({ k: 'iff', a, b });
const all = (name, body) => ({ k: 'all', name, body });
const ex = (name, body) => ({ k: 'ex', name, body });

/* ==================== 3. 自由变量 / 元变量 工具 ==================== */

function freeVarsOfTerm(t, acc = new Set()) {
  if (t.k === 'v' && t.free) acc.add(t.name);
  else if (t.k === 'e') acc.add(t.name);
  else if (t.k === 'c') for (const a of t.args) freeVarsOfTerm(a, acc);
  return acc;
}
function freeVars(f, acc = new Set()) {
  switch (f.k) {
    case 'atom': for (const t of f.args) freeVarsOfTerm(t, acc); return acc;
    case 'eq': freeVarsOfTerm(f.a, acc); freeVarsOfTerm(f.b, acc); return acc;
    case 'not': return freeVars(f.a, acc);
    case 'and': case 'or': case 'imp': case 'iff':
      freeVars(f.a, acc); return freeVars(f.b, acc);
    case 'all': case 'ex': {
      const before = new Set(acc);
      freeVars(f.body, acc);
      for (const n of before) acc.delete(n);
      return acc;
    }
    default: return acc;
  }
}
const isClosed = (f) => freeVars(f).size === 0;

/* ==================== 4. 替换 (打开 / 闭合) ==================== */

function openAtTerm(t, idx, sub) {
  switch (t.k) {
    case 'b': return t.i === idx ? sub : (t.i > idx ? B(t.i - 1) : t);
    case 'c': return c0(t.name, ...t.args.map((a) => openAtTerm(a, idx, sub)));
    default: return t;
  }
}
function openAt(f, idx, sub) {
  switch (f.k) {
    case 'atom': return atom(f.name, ...f.args.map((t) => openAtTerm(t, idx, sub)));
    case 'eq': return eq(openAtTerm(f.a, idx, sub), openAtTerm(f.b, idx, sub));
    case 'not': return not(openAt(f.a, idx, sub));
    case 'and': return and(openAt(f.a, idx, sub), openAt(f.b, idx, sub));
    case 'or': return or(openAt(f.a, idx, sub), openAt(f.b, idx, sub));
    case 'imp': return imp(openAt(f.a, idx, sub), openAt(f.b, idx, sub));
    case 'iff': return iff(openAt(f.a, idx, sub), openAt(f.b, idx, sub));
    case 'all': return all(f.name, openAt(f.body, idx + 1, sub));
    case 'ex': return ex(f.name, openAt(f.body, idx + 1, sub));
    default: return f;
  }
}
function closeAtTerm(t, idx, name) {
  switch (t.k) {
    case 'b': return t.i >= idx ? B(t.i + 1) : t;
    case 'v': return (t.free && t.name === name) ? B(idx) : t;
    case 'c': return c0(t.name, ...t.args.map((a) => closeAtTerm(a, idx, name)));
    default: return t;
  }
}
function closeAt(f, idx, name) {
  switch (f.k) {
    case 'atom': return atom(f.name, ...f.args.map((t) => closeAtTerm(t, idx, name)));
    case 'eq': return eq(closeAtTerm(f.a, idx, name), closeAtTerm(f.b, idx, name));
    case 'not': return not(closeAt(f.a, idx, name));
    case 'and': return and(closeAt(f.a, idx, name), closeAt(f.b, idx, name));
    case 'or': return or(closeAt(f.a, idx, name), closeAt(f.b, idx, name));
    case 'imp': return imp(closeAt(f.a, idx, name), closeAt(f.b, idx, name));
    case 'iff': return iff(closeAt(f.a, idx, name), closeAt(f.b, idx, name));
    case 'all': return all(f.name, closeAt(f.body, idx + 1, name));
    case 'ex': return ex(f.name, closeAt(f.body, idx + 1, name));
    default: return f;
  }
}
const instAll = (f, t) => openAt(f.body, 0, t);
const genEx = (f, fvName, witness) => ex(fvName, closeAt(f, 0, witness.name));

/* ==================== 5. α 等价 ==================== */

function termEq(a, b) {
  if (a === b) return true;
  if (a.k !== b.k) return false;
  switch (a.k) {
    case 'b': return a.i === b.i;
    case 'n': return a.n === b.n;
    case 'v': return a.name === b.name && a.free === b.free;
    case 'e': return a.name === b.name;
    case 'c': return a.name === b.name && a.args.length === b.args.length && a.args.every((x, i) => termEq(x, b.args[i]));
    default: return false;
  }
}
function alphaEq(a, b) {
  if (a === b) return true;
  if (a == null || b == null) return false;
  if (a.k !== b.k) return false;
  // 项也带 k 字段：交给 termEq，避免把 a = b 与 b = c 判成不等
  if (TERM_KINDS.has(a.k)) return termEq(a, b);
  switch (a.k) {
    case 'top': case 'bot': return true;
    case 'atom': return a.name === b.name && a.args.length === b.args.length && a.args.every((x, i) => termEq(x, b.args[i]));
    case 'eq': return termEq(a.a, b.a) && termEq(a.b, b.b);
    case 'not': return alphaEq(a.a, b.a);
    case 'and': case 'or': case 'imp': case 'iff': return alphaEq(a.a, b.a) && alphaEq(a.b, b.b);
    case 'all': case 'ex': return alphaEq(a.body, b.body);
    default: return false;
  }
}

/* ==================== 6. 打印 ==================== */

const TERM_KINDS = new Set(['v', 'n', 'c', 'b', 'e']);
const PREC = { iff: 1, imp: 2, or: 3, and: 4, not: 5, cmp: 6, add: 7, mul: 8, post: 9, atom: 10 };
const INFIX = { add: '+', sub: '-', mul: '*', div: '/' };
const REL = { lt: '<', le: '≤', gt: '>', ge: '≥' };

function ctxName(ctx, i) { return ctx[i] !== undefined ? ctx[i] : ('x' + (i + 1)); }
function wrap(s, p, outer) { return p < outer ? '(' + s + ')' : s; }

// force = 是否必须加括号（由调用方根据优先级与结合方向决定）。
// 每个节点的括号需求只由“父级要求”决定，绝不把父级要求继续传给子节点，
// 否则会出现 x * (x + x) 被打印成 x * x + x 这类错误。
function termStr(t, ctx = [], force = false) {
  const par = (s) => (force ? '(' + s + ')' : s);
  switch (t.k) {
    case 'b': return ctxName(ctx, t.i);
    case 'v': case 'e': return t.name;
    case 'n': return String(t.n);                  // 原子：无需括号
    case 'c': {
      const name = t.name, args = t.args;
      if (INFIX[name] && args.length === 2) {
        // 左结合（+ - * /）：左孩子同级可省（依赖左结合重解析），右孩子同级必须括
        const rel = (name === 'add' || name === 'sub') ? PREC.add : PREC.mul;
        const needLeft = isLooser(args[0], rel);
        const needRight = !isTighter(args[1], rel);
        const s = termStr(args[0], ctx, needLeft) + ' ' + INFIX[name] + ' ' + termStr(args[1], ctx, needRight);
        return par(s);
      }
      if (name === 'neg' && args.length === 1) return par('-' + termStr(args[0], ctx, true));
      // 后缀运算：底数必须是一元项，否则加括号（(2 + 3)² 不能写成 2 + 3²）
      if (name === 'sq' && args.length === 1) return par(termStr(args[0], ctx, true) + '²');
      if (name === 'pow' && args.length === 2) return par(termStr(args[0], ctx, false) + '^' + termStr(args[1], ctx, false));
      if (args.length === 0) return name;
      if (name === 'abs' && args.length === 1) return par('|' + termStr(args[0], ctx, false) + '|');
      if (name === 'set') return par('{' + args.map((a) => termStr(a, ctx, false)).join(', ') + '}');
      return par(name + '(' + args.map((a) => termStr(a, ctx, false)).join(', ') + ')');
    }
    default: return '?';
  }
}
// 顶层结合力：null = 原子/后缀/函数调用（最紧），否则为中缀运算符的结合力
function topLevel(t) {
  if (t.k !== 'c') return null;
  if (INFIX[t.name] && t.args.length === 2) return (t.name === 'add' || t.name === 'sub') ? PREC.add : PREC.mul;
  if (t.name === 'neg') return PREC.mul;
  return null;
}
function isLooser(t, rel) { const lvl = topLevel(t); return lvl !== null && lvl < rel; }
function isTighter(t, rel) { const lvl = topLevel(t); return lvl === null || lvl > rel; }

// 公式打印：只有双子句的连接词才需要“更紧才免括号”，一元连接词与量词内部一律完整打印。
// 这样 (2 + 3) = 5 不会被写成 2 + 3 = 5 那种丢括号的形式。
function fstr(f, ctx = [], force = false) {
  const par = (s) => (force ? '(' + s + ')' : s);
  switch (f.k) {
    case 'top': return '⊤';
    case 'bot': return '⊥';
    case 'atom': {
      const name = f.name, args = f.args;
      if (name === 'mem' && args.length === 2) return par(termStr(args[0], ctx, pr(f.args[0])) + ' ∈ ' + termStr(args[1], ctx, pr(f.args[1])));
      if (REL[name] && args.length === 2) return par(termStr(args[0], ctx, pr(f.args[0])) + ' ' + REL[name] + ' ' + termStr(args[1], ctx, pr(f.args[1])));
      if (args.length === 0) return name;
      return par(name + '(' + args.map((a) => termStr(a, ctx, false)).join(', ') + ')');
    }
    case 'eq': return par(termStr(f.a, ctx, pr(f.a)) + ' = ' + termStr(f.b, ctx, pr(f.b)));
    case 'not': return par('¬' + fstr(f.a, ctx, true));
    case 'and': case 'or': case 'imp': case 'iff': {
      const lvl = { and: PREC.and, or: PREC.or, imp: PREC.imp, iff: PREC.iff }[f.k];
      const sym = { and: ' ∧ ', or: ' ∨ ', imp: ' → ', iff: ' ↔ ' }[f.k];
      // 子公式必须“本来就比本连接词更紧”才免括号：这样 A ∧ (B ∨ A) 不会退化成 A ∧ B ∨ A
      const needParen = (child) => {
        const cl = fLevel(child);
        return cl !== null && cl <= lvl;
      };
      return par(fstr(f.a, ctx, needParen(f.a)) + sym + fstr(f.b, ctx, needParen(f.b)));
    }
    case 'all': return par('∀' + f.name + ', ' + fstr(f.body, [f.name].concat(ctx), false));
    case 'ex': return par('∃' + f.name + ', ' + fstr(f.body, [f.name].concat(ctx), false));
    default: return '?';
  }
}

/* ---------- 多项式正规化：良基的“环化简”，其合法性由域公理保证 ---------- */
// 有理数
function gcdInt(a, b) { a = Math.abs(a); b = Math.abs(b); while (b) { const t = a % b; a = b; b = t; } return a || 1; }

const fNeg = (a) => ({ n: -a.n, d: a.d });
const fZero = { n: 0, d: 1 };
const fOne = { n: 1, d: 1 };

// 多项式：Map<monomialKey, frac>，monomialKey 形如 "*x^2*y"
const MONO_ONE = '';
function monoKey(pairs) {

}
// 合并两个“单项式键”（每个键是若干变量幂的乘积），而不是把键当成单个变量
function monoMul(a, b) {
  const count = new Map();

    for (const seg of part.split('*')) {
      const [v, e] = seg.split('^');
      count.set(v, (count.get(v) || 0) + (e === undefined ? 1 : Number(e)));

}
function polyZero() { return new Map(); }
function polyConst(f) { const m = new Map(); if (f.n !== 0) m.set(MONO_ONE, f); return m; }
function polyVar(name) { const m = new Map(); m.set(monoKey([[name, 1]]), fOne); return m; }
function polyAdd(a, b) {
  const out = new Map(a);

    const cur = out.get(k) || fZero;

    if (sum.n === 0) out.delete(k); else out.set(k, sum);

}
function polyNeg(a) { const out = new Map(); for (const [k, v] of a) { const w = fNeg(v); if (w.n) out.set(k, w); } return out; }

  const out = new Map();
  for (const [ka, va] of a) for (const [kb, vb] of b) {
    const k = monoMul(ka, kb);
    const tr = fAdd(out.get(k) || fZero, fMul(va, vb));   // 同名项系数必须累加

// 把项转成多项式；不支持的构造返回 null
function polyOfTerm(t) {

    case 'v': return polyVar(t.name);
    case 'b': return polyVar('#' + t.i);
    case 'e': return polyVar('?' + t.name);
    case 'c': {
      const { name, args } = t;
      const ps = args.map(polyOfTerm);
      if (ps.some((p) => p === null)) return null;
      switch (name) {
        case 'add': return polyAdd(ps[0], ps[1]);
        case 'sub': return polySub(ps[0], ps[1]);
        case 'mul': return polyMul(ps[0], ps[1]);
        case 'neg': return polyNeg(ps[0]);
        case 'sq': return polyMul(ps[0], ps[0]);
        case 'pow': {

          if (e.k !== 'n' || e.n < 0 || e.n > 32) return null;

    const coef = v.d === 1 ? String(v.n) : v.n + '/' + v.d;
    if (k === MONO_ONE) return coef;
    return (v.n === 1 && v.d === 1) ? k : coef + '*' + k;

// 多项式 → 项：用于把等式两边化为同一个规范形式
function polyToTerm(p) {
  if (p.size === 0) return lit(0);
  // 按次数从高到低排列（课本写法：x² + 2x + 1），同次按单项式键
  const entries = [...p.entries()].sort((a, b) => {
    const da = monoDegree(a[0]), db = monoDegree(b[0]);
    if (da !== db) return db - da;
    return a[0] < b[0] ? -1 : a[0] > b[0] ? 1 : 0;

  let acc = terms[0];
  for (let i = 1; i < terms.length; i++) {
    const f = entries[i][1];
    // 负系数写成减法，更接近课本写法（x² - y² 而不是 x² + -1 * y²）
    acc = negativeTerm(f) ? c0('sub', acc, terms[i]) : c0('add', acc, terms[i]);

}
function negativeTerm(f) { return f.n < 0; }
function monoDegree(key) {
  if (key === '') return 0;

    const parts = seg.split('^');
    d += parts.length > 1 ? Number(parts[1]) : 1;
  }

}
function monoToTerm(key, f) {

    const parts = seg.split('^');
    const vname = parts[0];
    const exp = parts.length > 1 ? Number(parts[1]) : 1;
    let base = vname.charAt(0) === '#' ? { k: 'b', i: Number(vname.slice(1)) } : v(vname, false);

}
function fracToTerm(f) {
  if (f.d === 1) return lit(f.n);

}

function ringEqual(a, b) {
  const pa = polyOfTerm(a), pb = polyOfTerm(b);

  if (pa.size !== pb.size) return false;
  for (const [k, v] of pa) {

  }

// 规则使用的判定 + 记录用到的公理
function ringJustification(pa, pb) {
  const used = [];
  const need = (name) => { if (used.indexOf(name) < 0) used.push(name); };
  const walk = (t) => {
    if (t.k !== 'c') return;
    if (t.name === 'add' || t.name === 'sub') need('加法交换/结合');
    if (t.name === 'mul') need('乘法交换/结合/分配');
    if (t.name === 'neg') need('加法逆元');
    if (t.name === 'sq' || t.name === 'pow') need('幂的定义');
    if (t.name === 'n') need('数域运算');
    t.args.forEach(walk);
  };

/* ---------- 规则表 ---------- */
// 每条规则：name（显示名）、hint（说明）、arity（前提个数，null=不定）、needTerm、needFormula
const RULES = {
  hyp:       { name: '引用前提',     hint: '直接引用一个已知事实（公理、题设、已证结论）', arity: 1 },
  andI:      { name: '合取引入 ∧I',  hint: '由 A 与 B 得到 A ∧ B', arity: 2 },
  andE:      { name: '合取消去 ∧E',  hint: '由 A ∧ B 得到 A 或 B', arity: 1, picks: ['左', '右'] },
  orI:       { name: '析取引入 ∨I',  hint: '由 A 得到 A ∨ B（B 可任取）', arity: 1, needFormula: true },
  orE:       { name: '析取消去 ∨E',  hint: 'A ∨ B，A → C，B → C ⟹ C', arity: 3 },
  impE:      { name: '蕴含消去 →E',  hint: 'A → B 与 A ⟹ B（假言推理）', arity: 2 },
  impI:      { name: '蕴含引入 →I',  hint: '假设 A 推出 B，则得 A → B（先点“假设”）', arity: 1, needScope: true },
  negE:      { name: '否定消去 ¬E',  hint: 'A 与 ¬A ⟹ ⊥', arity: 2 },
  negI:      { name: '否定引入 ¬I',  hint: '假设 A 推出 ⊥，则得 ¬A（先点“假设”）', arity: 1, needScope: true },
  raa:       { name: '反证法 ⊥C',    hint: '假设 ¬A 推出 ⊥，则得 A', arity: 1, needScope: true },
  allE:      { name: '全称消去 ∀E',  hint: '∀x, P(x) ⟹ P(t)，把一个普遍公理用到具体对象上', arity: 1, needTerm: true },
  exI:       { name: '存在引入 ∃I',  hint: 'P(t) ⟹ ∃x, P(x)', arity: 1, needTerm: true },
  eqRefl:    { name: '自反 =I',      hint: 't = t', arity: 0, needTerm: true },
  eqSym:     { name: '对称 =Sym',    hint: 'a = b ⟹ b = a', arity: 1 },
  eqTrans:   { name: '传递 =Trans',  hint: 'a = b，b = c ⟹ a = c', arity: 2 },
  eqRewrite: { name: '等量代换 =Sub', hint: 'a = b 与 P(a) ⟹ P(b)', arity: 2 },
  iffI:      { name: '等价引入 ↔I',  hint: 'A → B 与 B → A ⟹ A ↔ B', arity: 2 },
  iffE:      { name: '等价消去 ↔E',  hint: 'A ↔ B ⟹ A → B 或 B → A', arity: 1, picks: ['→', '←'] },
  ring:      { name: '代数化简 Ring',  hint: '由域公理推出的等式化简：两边化成同一个多项式即成立', arity: 1 },
  arith:     { name: '数值计算',      hint: '两边都是具体数字时直接算出相等/不等关系', arity: 1 },
  eqOp:      { name: '两边同时运算',  hint: '等式两边同加/同减/同乘/同除/同取负/同平方', arity: 1, needOp: true },
  eqOpTerm:  { name: '两边同加/乘一个式子', hint: '两边同加或同乘同一个项（不只是数字），解方程常用', arity: 1, needOp: true },
  excludedMiddle: { name: '排中律', hint: 'A ∨ ¬A 恒成立，可用于分情况讨论', arity: 0 },
};
const RULE_ORDER = ['hyp', 'impE', 'impI', 'andI', 'andE', 'orI', 'orE', 'negE', 'negI', 'raa', 'excludedMiddle', 'allE', 'exI', 'eqRefl', 'eqSym', 'eqTrans', 'eqRewrite', 'eqOp', 'iffI', 'iffE', 'ring', 'arith'];

/* 具体数字求值（仅纯数字表达式，健全） */
function evalConcrete(t) {
  const r = (x) => {
    if (x.k === 'n') return x.n;
    if (x.k !== 'c') return null;
    const a = x.args.map(r);
    if (a.some((y) => y === null)) return null;
    switch (x.name) {
      case 'add': return a[0] + a[1];
      case 'sub': return a[0] - a[1];
      case 'mul': return a[0] * a[1];
      case 'div': return a[1] === 0 ? null : a[0] / a[1];
      case 'neg': return -a[0];
      case 'sq': return a[0] * a[0];
      case 'pow': return Math.pow(a[0], a[1]);
      case 'abs': return Math.abs(a[0]);
      default: return null;
    }
  };
  return r(t);
}

/* 具体数字化简：能算的部分算出来（仍保留符号部分），例如 x + 1 - 1 → x、5 - 1 → 4 */
function evalReduce(t) {
  const r = (x) => {
    if (x.k === 'n') return lit(x.n);
    if (x.k !== 'c') return x;
    const args = x.args.map(r);
    const v = evalConcrete({ k: 'c', name: x.name, args });
    if (v !== null && Number.isInteger(v) && Math.abs(v) <= 1e9) return lit(v);
    switch (x.name) {
      case 'add':
        if (args[1].k === 'n' && args[1].n === 0) return args[0];
        if (args[0].k === 'n' && args[0].n === 0) return args[1];
        break;
      case 'sub': {
        if (args[1].k === 'n' && args[1].n === 0) return args[0];
        // 线性抵消：(t + c) - c → t，(c + t) - c → t，(t - c) + c → t
        const t = flattenAdd(args[0]);
        const hit = t.findIndex((x) => termEq(x, args[1]));
        if (hit >= 0) {
          const rest = t.filter((_, i) => i !== hit);
          if (rest.length === 0) return lit(0);
          return rest.reduce((a, b) => c0('add', a, b));
        }
        break;
      }
      case 'add': {
        // (t + c) + (-c) → t
        if (args[1].k === 'c' && args[1].name === 'neg') {
          const t = flattenAdd(args[0]);
          const hit = t.findIndex((x) => termEq(x, args[1].args[0]));
          if (hit >= 0) {
            const rest = t.filter((_, i) => i !== hit);
            if (rest.length === 0) return lit(0);
            return rest.reduce((a, b) => c0('add', a, b));
          }
        }
        break;
      }
      case 'mul':
        if (args[1].k === 'n' && args[1].n === 1) return args[0];
        if (args[0].k === 'n' && args[0].n === 1) return args[1];
        if ((args[1].k === 'n' && args[1].n === 0) || (args[0].k === 'n' && args[0].n === 0)) return lit(0);
        break;
      case 'div': {
        if (args[1].k === 'n' && args[1].n === 1) return args[0];
        if (args[1].k === 'n') {
          const n = args[1].n;
          // 先把分子里的常数因子提出来约分：(c*t)/c → t，(c*t)/d → (c/d)*t
          const split = splitCoefficient(args[0]);
          if (split && split.c % n === 0) {
            const q = split.c / n;
            return q === 1 ? split.t : c0('mul', lit(q), split.t);
          }
          if (split && n % split.c === 0) {
            // (c*t)/d → t * (c/d)，保留分数系数避免引入除法
            const num = split.c, den = n;
            const g = gcdInt(num, den);
            const p = num / g, q2 = den / g;
            const frac = c0('div', lit(p), lit(q2));
            return c0('mul', frac, split.t);
          }
          const f = factorOut(args[0], n);
          if (f !== null) return f;
          if (args[0].k === 'n' && args[0].n % n === 0) return lit(args[0].n / n);
        }
        break;
      }
      case 'neg': if (args[0].k === 'n') return lit(-args[0].n); break;
      default: break;
    }
    return c0(x.name, ...args);
  };
  return r(t);
}

// 提取“常数系数 × 其余部分”：3*x → {c:3, t:x}，x → {c:1, t:x}，2*(x+1) → {c:2, t:x+1}
function splitCoefficient(t) {
  if (t.k === 'n') return { c: t.n, t: lit(1) };
  if (t.k !== 'c') return { c: 1, t };
  if (t.name === 'mul') {
    for (const [a, b] of [[t.args[0], t.args[1]], [t.args[1], t.args[0]]]) {
      if (a.k === 'n') return { c: a.n, t: b };
    }
  }
  if (t.name === 'neg') {
    const inner = splitCoefficient(t.args[0]);
    return { c: -inner.c, t: inner.t };
  }
  if (t.name === 'div' && t.args[1].k === 'n' && t.args[0].k === 'n') {
    return { c: t.args[0].n / t.args[1].n, t: lit(1) };
  }
  return { c: 1, t };
}

// 把 add 链摊平成因子列表
function flattenAdd(t) {
  if (t.k === 'c' && t.name === 'add') return flattenAdd(t.args[0]).concat(flattenAdd(t.args[1]));
  return [t];
}
// 若能提出因子 n，返回 (t / n)；否则返回 null
function factorOut(t, n) {
  if (t.k === 'c' && t.name === 'mul') {
    for (const [a, b] of [[t.args[0], t.args[1]], [t.args[1], t.args[0]]]) {
      if (a.k === 'n' && a.n % n === 0) {
        const q = a.n / n;
        return q === 1 ? b : c0('mul', lit(q), b);
      }
    }
  }
  return null;
}

/* 对等式两边施加同一运算：f(a) = f(b)。运算必须是可判定的具体函数或“化简”。 */
const EQUATION_OPS = {
  add: (t, n) => evalReduce(c0('add', t, lit(n))),
  sub: (t, n) => evalReduce(c0('sub', t, lit(n))),
  mul: (t, n) => evalReduce(c0('mul', t, lit(n))),
  div: (t, n) => evalReduce(c0('div', t, lit(n))),
  neg: (t) => evalReduce(c0('neg', t)),
  sq: (t) => c0('sq', t),
};

class RuleError extends Error {}

/* ---------- 主检查入口 ----------
 * state: { facts: Fact[], scope: string|null, nextId: number, freshCount: number }
 * Fact:  { id, f, rule, from: string[], terms?: Term[], scope: string|null, name?: string }
 * req:   { rule, ids: string[], term?: Term, formula?: Formula, pick?: '左'|'右'|'→'|'←' }
 */
function runRule(state, req) {
  const spec = RULES[req.rule];
  if (!spec) throw new RuleError('未知规则: ' + req.rule);
  const byId = new Map(state.facts.map((f) => [f.id, f]));
  const premises = (req.ids || []).map((id) => {
    const f = byId.get(id);
    if (!f) throw new RuleError('找不到前提 ' + id);
    return f;
  });
  if (spec.arity !== null && premises.length !== spec.arity) {
    throw new RuleError(spec.name + ' 需要 ' + spec.arity + ' 个前提，当前选了 ' + premises.length + ' 个');
  }
  const P = premises.map((x) => x.f);
  const scopeOf = (list) => {
    const s = new Set();
    for (const f of list) {
      if (!f.scope) continue;
      for (const x of String(f.scope).split('|')) if (x) s.add(x);
    }
    return s;
  };
  // 作用域是否闭合：所用假设都必须仍在当前打开的子证明里
  const scopeClosed = (s) => [...s].every((id) => state.scopeStack.indexOf(id) >= 0);
  const out = (f, extra = {}) => {
    const sc = extra.scope !== undefined ? extra.scope : mergeScope(premises);
    return { f, rule: req.rule, terms: extra.terms || [], scope: sc, pick: extra.pick };
  };
  const mergeScope = (list) => {
    const s = scopeOf(list);
    return s.size ? [...s].sort().join('|') : null;
  };

  switch (req.rule) {
    case 'hyp': return out(P[0]);
    case 'andI':
      if (P[0].k !== 'and' && P[1].k !== 'and') return out(and(P[0], P[1]));
      throw new RuleError('∧I 的前提不应已经是合取式');
    case 'andE': {
      if (P[0].k !== 'and') throw new RuleError('∧E 需要一个合取式前提 A ∧ B');
      const pick = req.pick === '右' ? 1 : req.pick === '左' ? 0 : null;
      if (pick === null) throw new RuleError('∧E 需要选择取左边还是右边');
      return out(pick === 0 ? P[0].a : P[0].b, { pick: req.pick });
    }
    case 'orI': {
      if (!req.formula) throw new RuleError('∨I 需要给出要或上的另一支');
      const target = req.formula;
      if (target.k !== 'or') throw new RuleError('∨I 的结果必须是 A ∨ B 形式');
      if (alphaEq(target.a, P[0]) || alphaEq(target.b, P[0])) return out(target);
      throw new RuleError('∨I：' + fstr(P[0]) + ' 不是 ' + fstr(target) + ' 的析取支');
    }
    case 'orE': {
      const [d, i1, i2] = P;
      if (d.k !== 'or') throw new RuleError('∨E 的第一个前提应是 A ∨ B');
      const branches = [[i1, d.a], [i2, d.b]];
      for (const [im, want] of branches) {
        if (im.k !== 'imp' || !alphaEq(im.a, want)) {
          throw new RuleError('∨E 需要两支蕴含：' + fstr(want) + ' → C，当前给出 ' + fstr(im));
        }
      }
      if (!alphaEq(i1.b, i2.b)) throw new RuleError('∨E 两支的结论必须相同');
      return out(i1.b);
    }
    case 'impE': {
      const i = P.find((x) => x.k === 'imp');
      if (!i) throw new RuleError('→E 需要一个蕴含式前提 A → B');
      const other = P[0] === i ? P[1] : P[0];
      if (!alphaEq(i.a, other)) throw new RuleError('→E 不匹配：需要 ' + fstr(i.a) + '，手上有 ' + fstr(other));
      return out(i.b);
    }
    case 'impI': case 'negI': case 'raa': {
      if (P.length !== 1) throw new RuleError('该规则需要恰好一个已推导出的事实');
      const s = scopeOf(premises);

    else if (g && g.k === 'not') tip += '要证 ' + P(g) + '，请先假设 ' + P(g.a) + ' 并推出矛盾。';
    else tip += '可以先点下方“打开假设”开一个子证明，或看看规则区的引导。';
    empty.textContent = tip;
    box.appendChild(empty);
  }
  for (const f of vis) {
    const el = document.createElement('div');
    const cls = f.rule === 'assume' ? ' assume' : (f.given ? '' : ' derived');
    el.className = 'fact' + (selected.indexOf(f.id) >= 0 ? ' sel' : '') + cls;
    el.innerHTML = '<span class="id">' + escapeHtml(f.id) + '</span><span><span class="fx">' + escapeHtml(P(f.f)) +
      '</span><br><span class="meta">' + escapeHtml(factLabel(f)) + '</span></span>';
    el.onclick = () => toggleSelect(f.id);
    box.appendChild(el);
  }
  $('select-hint').textContent = '已选 ' + selected.length + ' 条' + (selected.length ? '：' + selected.join(', ') : '');
  renderScopes();
}

/* 把“当前打开的子证明”显式列出来：玩家据此知道现在处在哪一层，
   也才知道 ∨E / ↔I 这类需要合上两支的规则该收哪一层。 */
function renderScopes() {
  const box = $('scope-list');
  if (!box) return;
  const stack = state.scopeStack || [];
  box.innerHTML = '';
  if (!stack.length) {
    box.innerHTML = '<span class="scope-none">当前没有打开的子证明</span>';
    return;
  }
  stack.forEach((id, i) => {
    const sp = document.createElement('span');
    sp.className = 'scope-chip';
    const f = state.assumptions && state.assumptions[id];
    sp.textContent = (i + 1) + '. ' + id + (f ? '：' + P(f) : '');
    sp.title = '第 ' + (i + 1) + ' 层子证明，合上时收最内层';
    box.appendChild(sp);
  });
}

function factLabel(f) {
  if (f.rule === 'premise') return '题设';
  if (f.rule === 'axiom') return '公理 ' + (f.ax ? f.ax.id : '') + (f.ax && f.ax.note ? ' · ' + f.ax.note : '');
  if (f.rule === 'assume') return '子证明假设（作用域 ' + f.scope + '）';
  if (f.rule === 'hyp') return '引用前提';
  const spec = RULES[f.rule];
  const terms = (f.terms || []).map((t) => termStr(t, [])).filter(Boolean);
  return (spec ? spec.name : f.rule) + (terms.length ? ' [' + terms.join('、') + ']' : '') + (f.scope ? ' · 依赖假设 ' + f.scope : '');
}

function toggleSelect(id) {
  const i = selected.indexOf(id);
  if (i >= 0) selected.splice(i, 1); else selected.push(id);
  renderFacts();
}

/* ---------------- 规则按钮 ---------------- */
function renderRules() {
  const box = $('rules');
  box.innerHTML = '';
  const avail = (state.level.rules || []).filter((r) => RULES[r]);
  for (const rid of RULE_ORDER.filter((r) => avail.indexOf(r) >= 0)) {
    const spec = RULES[rid];
    const btn = document.createElement('button');
    btn.className = 'rule' + (rid === 'impE' || rid === 'ring' ? ' primary' : '');
    btn.textContent = spec.name;
    btn.title = spec.hint;
    btn.onclick = () => useRule(rid);
    box.appendChild(btn);
  }
}

/* ---------------- 证明记录 ---------------- */
function renderProof() {
  const box = $('proof');
  box.innerHTML = '';
  let n = 0;
  const closed = new Set(state.closedScopes || []);
  for (const f of state.facts) {
    if (f.given) continue;
    n++;
    const li = document.createElement('li');
    const spec = RULES[f.rule];
    // 子证明的层次：作用域是 "H1|H2" 就说明处在第二层
    const depth = f.scope ? String(f.scope).split('|').filter(Boolean).length : 0;
    const parts = f.scope ? String(f.scope).split('|') : [];
    const isClosed = parts.some((id) => closed.has(id));
    li.className = 'proof-line depth' + Math.min(3, depth) + (isClosed ? ' closed' : '');
    const why = f.rule === 'assume'
      ? '假设（子证明 ' + f.scope + '）'
      : (spec ? spec.name : f.rule) + (f.scope ? ' · 依赖 ' + f.scope : '');
    li.innerHTML = '<span class="fx">' + escapeHtml(P(f.f)) + '</span><span class="why">' +
      escapeHtml(why) + (isClosed ? ' · 已合上' : '') + '</span>';
    box.appendChild(li);
  }
  $('proof-hint').textContent = n + ' 步' + (state.scopeStack.length ? '（子证明 ' + state.scopeStack.length + ' 层开着）' : '');
}

/* ---------------- 公理表 ---------------- */
function renderAxioms() {
  const box = $('axioms');
  box.innerHTML = '';
  const ax = state.compiled.axioms;
  if (!ax.length) { box.textContent = '本关不需要额外公理（只用逻辑规则）。'; return; }
  const table = document.createElement('table');
  for (const a of ax) {
    const tr = document.createElement('tr');
    tr.innerHTML = '<td class="n">' + escapeHtml(a.id) + '</td><td class="f">' + escapeHtml(P(a.f)) + '</td><td class="d">' + escapeHtml(a.note || '') + '</td>';
    table.appendChild(tr);
  }
  box.appendChild(table);
}

/* ---------------- 走一步 ---------------- */
function useRule(rid) {
  const spec = RULES[rid];
  if (!spec) return;
  // 不用浏览器弹窗：由 candidates 模块算出所有成立的分支，再决定自动执行还是让玩家点选
  const cands = candidateSteps(state, rid, selected.slice());
  // 前提数量不对时，如果存在引导（例如“分情况讨论”），就先把引导给玩家看，
  // 只报“需要恰好 N 个前提”会让人卡住——他本来就需要先知道要开哪两支。
  if (spec.arity !== null && selected.length !== spec.arity) {
    if (cands.some((c) => c.guide)) { showChoices(rid, cands); return; }
    setStatus('“' + spec.name + '”需要恰好 ' + spec.arity + ' 个前提，当前选了 ' + selected.length + ' 个。' + (spec.arity === 2 ? '（按住 Ctrl 可多选）' : ''), 'warn');
    return;
  }
  if (!cands.length) {
    const probe = tryStep(state, { rule: rid, ids: selected.slice() });
    setStatus('这一步不成立：' + (probe.error || '没有可用的结果。先看看前提选对了没有。'), 'bad');
    return;
  }
  // 引导型候选（例如分情况讨论的说明）不是可执行的步骤，要单独渲染
  if (cands.every((c) => c.guide)) { showChoices(rid, cands); return; }
  const steps = cands.filter((c) => c.step);
  if (steps.length === 1) { commit(steps[0].step); return; }
  const hit = pickGoalCandidate(state, steps, state.goal) || pickCaseSplitCandidate(state, steps, state.goal);
  if (hit) { commit(hit.step); return; }
  showChoices(rid, cands);
}

/* 把候选步骤渲染成一行可选择的结果 */
function showChoices(rid, cands, base) {
  const spec = RULES[rid];
  const box = $('choices');
  box.hidden = false;
  box.innerHTML = '';
  const head = document.createElement('div');
  head.className = 'choices-head';
  head.textContent = '“' + spec.name + '”有多种可能，点一个执行：';
  box.appendChild(head);
  // 引导型：把“每一支要推出什么”摆出来，并给一键“开始这一支”
  for (const c of cands.filter((x) => x.guide === 'caseSplit')) {
    const g = document.createElement('div');
    g.className = 'guide';
    g.innerHTML = '<div class="guide-head">' + escapeHtml(c.label) + '</div>';
    box.appendChild(g);
    for (const b of c.branches) {
      const row = document.createElement('div');
      row.className = 'guide-branch' + (b.done ? ' done' : '');
      row.innerHTML = '<span class="mark">' + (b.done ? '✓' : '·') + '</span><span>' + escapeHtml(b.text) + '</span>';
      if (!b.done) {
        const btn = document.createElement('button');
        btn.className = 'rule';
        btn.textContent = '开始这一支：假设 ' + b.assume;
        btn.onclick = () => { hideChoices(); $('assume-input').value = b.assume; openAssumption(); };
        row.appendChild(btn);
      }
      g.appendChild(row);
    }
    const tip = document.createElement('div');
    tip.className = 'guide-tip';
    tip.textContent = '两支都合上后，再选中这个析取与两条结论一起点 ∨E 就能收尾。';
    g.appendChild(tip);
  }
  // 引导型：引入类规则（→I / ¬I / ⊥C）要先开子证明——直接告诉他假设什么，并能一键打开
  for (const c of cands.filter((x) => x.guide === 'intro')) {
    const g = document.createElement('div');
    g.className = 'guide';
    g.innerHTML = '<div class="guide-head">' + escapeHtml(c.label) + '</div>';
    const row = document.createElement('div');
    row.className = 'guide-branch';
    row.innerHTML = '<span class="mark">·</span><span>子证明里要' + escapeHtml(c.need) + '</span>';
    const btn = document.createElement('button');
    btn.className = 'rule';
    btn.textContent = '开始：假设 ' + c.assume;
    btn.onclick = () => { hideChoices(); $('assume-input').value = c.assume; openAssumption(); };
    row.appendChild(btn);
    g.appendChild(row);
    if (c.hint) {
      const tip = document.createElement('div');
      tip.className = 'guide-tip';
      tip.textContent = c.hint;
      g.appendChild(tip);
    }
    box.appendChild(g);
  }
  for (const c of cands.filter((x) => x.step).slice(0, 16)) {
    const b = document.createElement('button');
    b.className = 'rule';
    b.textContent = c.label;
    b.title = '结果：' + c.label;
    b.onclick = () => { hideChoices(); commit(c.step); };
    box.appendChild(b);
  }
  // 允许自己写一个结果式（例如中间步骤 -3 ≤ 0）
  const customInput = document.createElement('input');
  customInput.placeholder = '或者自己写结果式，回车确认';
  customInput.onkeydown = () => {};
  const customBtn = document.createElement('button');
  customBtn.className = 'ghost';
  customBtn.textContent = '用我写的式子';
  customBtn.onclick = () => {
    const raw = (customInput.value || '').trim();
    if (!raw) { setStatus('请先在输入框里写出结果式。', 'warn'); return; }
    hideChoices();
    commit({ rule: rid, ids: selected.slice(), pick: base.pick, op: base.op, formula: raw });
  };
  box.appendChild(customInput);
  box.appendChild(customBtn);
  const cancel = document.createElement('button');
  cancel.className = 'ghost';
  cancel.textContent = '取消';
  cancel.onclick = () => { hideChoices(); setStatus('已取消这一步。', ''); };
  box.appendChild(cancel);
  setStatus('请在上方“候选结果”里选一个（' + cands.length + ' 种可能），也可以自己写结果式。', 'warn');
}
function hideChoices() { const b = $('choices'); b.hidden = true; b.innerHTML = ''; }

function commit(step) {
  hideChoices();
  try {
    const fact = applyStep(state, step);
    selected = [];
    hintIndex = 0;
    setStatus('✓ ' + P(fact.f) + '　（' + (RULES[fact.rule] ? RULES[fact.rule].name : fact.rule) + '）', 'ok');
    renderAll();
  } catch (e) {
    setStatus('✗ ' + (e instanceof RuleError ? e.message : String(e.message || e)), 'bad');
  }
}

/* ---------------- 假设 / 撤销 / 实例化 / 提示 ---------------- */
function openAssumption() {
  const raw = $('assume-input').value.trim();
  if (!raw) { setStatus('请先写出要假设的式子，例如 A 或 not B。', 'warn'); return; }
  commit({ assume: raw });
  $('assume-input').value = '';
}

function doUndo() {
  const last = undo(state);
  if (!last) { setStatus('没有可撤销的步骤。', 'warn'); return; }
  selected = [];
  setStatus('已撤销一步：' + P(last.f), '');
  renderAll();
}

function doInstantiate() {
  const created = instantiateAxioms(state, 400);
  setStatus(created.length ? '自动实例化了 ' + created.length + ' 条公理实例，已放进上面的“可用事实”。' : '没有新的可实例化公理（可能已经展开过）。', created.length ? 'ok' : 'warn');
  renderAll();
}

function doHint() {
  const lv = state.level;
  if (matchedFact(state)) { setStatus('这一关已经完成啦，可以点左边继续下一关。', 'ok'); return; }
  // 提示来源：优先手写标准证明，没有就用解算器自动搜到的证明
  const found = FOUND_PROOFS[lv.id];
  const plan = (lv.script && !lv.noScript) ? lv.script : (found ? found.steps : null);
  const fromSolver = !(lv.script && !lv.noScript) && !!found;
  if (!plan) {
    setStatus('本题是开放练习，解算器也还没搜出证明。' + (lv.scriptNote || '') + '　建议：先“展开全称公理”，再用 ∀E 与 →E 逐步推进。', 'warn');
    return;
  }
  const step = plan[hintIndex];
  if (!step) {
    setStatus('提示已经用完了。' + (lv.scriptNote || ''), 'warn');
    return;
  }
  const tag = fromSolver ? '（自动搜出的证明）' : '';
  setStatus('提示 ' + (hintIndex + 1) + '/' + plan.length + tag + '：' + describeStep(step), 'warn');
  hintIndex++;
}

function describeStep(step) {
  if (step.assume !== undefined) return '打开子证明，假设 ' + step.assume;
  const spec = RULES[step.rule];
  const ids = (step.ids || []).join(', ');
  const extra = [
    step.term ? '项 ' + step.term : '',
    step.pick ? '选择 ' + step.pick : '',
    step.formula ? '结果式 ' + step.formula : '',
    step.op ? '运算 ' + step.op.name + (step.op.n !== undefined ? ' ' + step.op.n : '') : '',
  ].filter(Boolean).join('，');
  return '选 ' + (ids || '（无前提）') + ' → 点“' + (spec ? spec.name : step.rule) + '”' + (extra ? '（' + extra + '）' : '');
}

function setStatus(msg, kind) {
  const el = $('status');
  el.textContent = msg;
  el.className = 'status' + (kind === 'ok' ? ' ok' : kind === 'bad' ? ' bad' : kind === 'warn' ? ' warn' : '');
}

function onSolved() {
  const id = state.level.id;
  const first = store.done.indexOf(id) < 0;
  store.mark(id);
  if (first) setStatus('🎉 完成 ' + id + '！结论已推出：' + P(state.goal), 'ok');
  renderLevelList();
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

/* ---------------- 事件绑定 ---------------- */
$('btn-assume').onclick = openAssumption;
$('assume-input').addEventListener('keydown', (e) => { if (e.key === 'Enter') openAssumption(); });
$('btn-undo').onclick = doUndo;
$('btn-instantiate').onclick = doInstantiate;
$('btn-hint').onclick = doHint;
$('btn-reset').onclick = () => { store.reset(); renderLevelList(); setStatus('本地进度已清空。', ''); };
$('btn-axioms').onclick = () => { const a = $('axioms'); a.hidden = !a.hidden; };

/* ---------------- 测试钩子（供无浏览器冒烟测试调用） ---------------- */
function debugState() { return state; }
function debugLevelId() { return state && state.level.id; }
function debugGoalText() { return $('goal-text').textContent; }
function debugStatusText() { return $('status').textContent; }
function debugSolved() { return !!matchedFact(state); }
function debugSelect(ids) { selected = ids.slice(); renderFacts(); }
function debugUseRule(rid) { useRule(rid); }
function debugAssumption(raw) { $('assume-input').value = raw; openAssumption(); }
function debugHint() { doHint(); }
/* 走“界面的真实路径”：设置选择 → useRule（含候选计算与自动挑选） */
function debugSelectAndUse(ids, rid) {
  selected = ids.slice();
  renderFacts();
  useRule(rid);
  return debugStatusText();
}
/* 当前可见的事实（id → 公式文本） */
function debugFacts() {
  return visibleFacts(state).map((f) => ({ id: f.id, text: P(f.f), rule: f.rule, scope: f.scope }));
}
/* 当前打开的子证明层数 */
function debugScopes() { return (state.scopeStack || []).slice(); }
/* 当前候选（不执行） */
function debugCandidates(ids, rid) {
  return candidateSteps(state, rid, ids.slice()).map((c) => c.label);
}
/* 候选里有没有“引导型”（分情况讨论 / 开子证明的说明） */
function debugGuides(ids, rid) {
  return candidateSteps(state, rid, ids.slice())
    .filter((c) => c.guide)
    .map((c) => ({
      guide: c.guide,
      label: c.label,
      assume: c.assume,
      need: c.need,
      branches: (c.branches || []).map((b) => b.text),
    }));
}
/* 候选面板里渲染出来的按钮文字（走的是真实渲染路径） */
function debugChoiceButtons() {
  const box = $('choices');
  if (!box) return [];
  const out = [];
  const walk = (el) => {
    if (!el) return;
    if (el.tagName === 'BUTTON') out.push(el.textContent || '');
    for (const c of el.children || []) walk(c);
  };
  walk(box);
  return out;
}
/* 可用事实面板里的文字（含空状态提示） */
function debugFactsText() {
  const box = $('facts');
  if (!box) return '(没有 facts 容器)';
  const out = [];
  const walk = (el, d) => {
    if (!el || d > 5) return;
    out.push('  '.repeat(d) + (el.tagName || '?') + (el.className ? '.' + el.className : '') + ' :: ' + (el.textContent || el._html || ''));
    for (const c of el.children || []) walk(c, d + 1);
  };
  walk(box, 0);
  return out.join('\n');
}

/* 候选面板里的文字内容（诊断用） */
function debugChoicesText() {
  const box = $('choices');
  if (!box) return '(没有 choices 容器)';
  const out = [];
  const walk = (el, d) => {
    if (!el || d > 5) return;
    out.push('  '.repeat(d) + (el.tagName || '?') + (el.className ? '.' + el.className : '') + ' :: ' + (el.textContent || el._html || ''));
    for (const c of el.children || []) walk(c, d + 1);
  };
  walk(box, 0);
  return out.join('\n');
}

/* 点击候选面板里第 i 个按钮 */
function debugClickChoice(i) {
  const box = $('choices');
  const btns = [];
  const walk = (el) => {
    if (!el) return;
    if (el.tagName === 'BUTTON') btns.push(el);
    for (const c of el.children || []) walk(c);
  };
  walk(box);
  const b = btns[i];
  if (!b) return false;
  if (b.onclick) b.onclick();
  return true;
}
function debugDescribe(step) { return describeStep(step); }
